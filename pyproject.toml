[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-runtime"
version = "0.1.0"
description = "A replayable, provenance-tracking runtime for AI agents: every effect journaled, every value labeled, every run reproducible."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Cairn contributors" }]
keywords = ["agents", "llm", "durable-execution", "prompt-injection", "information-flow-control", "mcp", "evaluation", "replay"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
anthropic = ["anthropic>=1.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.scripts]
cairn = "cairn.cli.main:main"

[project.urls]
Homepage = "https://github.com/nagendhra-web/New-Repo"
Documentation = "https://github.com/nagendhra-web/New-Repo/tree/main/docs"
Issues = "https://github.com/nagendhra-web/New-Repo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cairn = ["py.typed", "api/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: crosses subsystem boundaries (journal, runtime, tools)",
  "e2e: drives the CLI or HTTP API end to end",
]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
  "S101",   # asserts are used in tests
  "S603",   # subprocess use is deliberate and sandboxed
  "S607",
  "RUF012",
  "B008",
  "S311",   # random is used for jitter, not crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]
"src/cairn/agents/planner.py" = ["E501"]  # prompt text
"src/cairn/observability/render.py" = ["E501"]  # HTML template
"src/cairn/cli/main.py" = ["ASYNC240"]  # small synchronous file IO in a CLI is intentional
"examples/**" = ["S"]
"benchmarks/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["src/cairn"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cairn.api.*", "cairn.cli.*"]
disallow_untyped_decorators = false
