repos:
  - repo: local
    hooks:
      - id: no-em-dash
        name: forbid em dashes
        entry: python scripts/check_no_em_dash.py
        language: system
        pass_filenames: true
        types: [text]
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
